[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tmx-explorer"
version = "3.0.2"
description = "Visor OpenGL de mapas Tiled (TMX) con niveles de altura y personajes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "PyOpenGL>=3.1.6",
    "glfw>=2.5.0",
    "numpy>=1.21",
    "Pillow>=9.0",
]

[project.optional-dependencies]
zstd = ["zstandard"]
fast = ["PyOpenGL_accelerate"]
dev = ["pytest"]

[project.scripts]
tmx-explorer = "tmx_explorer.__main__:main"

[tool.setuptools]
py-modules = ["tmx_manager"]
packages = ["tmx_explorer", "tmx_explorer.entities", "tmx_explorer.map",
            "tmx_explorer.renderer", "tmx_explorer.shaders",
            "engine", "engine.world", "engine.compiler", "engine.render", "engine.physics", "engine.entities"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["tools/pieces/objparser.py"]   # código aportado, se mantiene tal cual
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "SIM", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLC0415",
          "PLW2901", "UP006", "UP007", "UP035", "UP037", "UP045", "SIM108"]
